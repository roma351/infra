# Метрики самого nginx.
#
# Голый nginx их не отдаёт — он умеет только stub_status: число
# соединений и суммарное число запросов. Разбивки по доменам, адресам
# и кодам ответа тут нет и не будет (это платный nginx plus или сборка
# своего образа с модулем VTS). Разбивка — из метрик приложений.
#
# Читает это nginx-exporter из проекта monitoring и переводит в метрики
# для Prometheus. Порт 8080 наружу не опубликован: до него достают
# только контейнеры из shared_net.
server {
    listen 8080;
    server_name _;

    location /stub_status {
        stub_status;
        access_log off;
    }

    location / {
        return 404;
    }
}
