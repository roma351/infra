server {
    listen 80 default_server;
    server_name _;

    # Проверка certbot'а — для любого домена, даже для того, у которого
    # своего конфига ещё нет. Иначе сертификат на новый поддомен не
    # выпустить: запрос приходит сюда и обрывается 444-м, а конфиг с
    # ssl_certificate без сертификата положил бы весь nginx. Курица и
    # яйцо; здесь оно разрывается.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Раньше return стоял прямо в server. Так нельзя: server-level
    # return отрабатывает до выбора location и съел бы проверку выше.
    location / {
        return 444 "nginx work ok";
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}